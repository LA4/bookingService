# docker-compose.yml

version: '3.8'
services:
  postgres:
    image: postgres:16
    restart: always
    environment:
      - POSTGRES_USER=booking
      - POSTGRES_PASSWORD=booking
    volumes:
      - postgres:/var/lib/postgresql/data
    networks:
      - private-net

  api:
    build: .
    container_name: booking_api
    restart: always
    environment:
      DATABASE_URL: postgresql://booking:booking@postgres:5432/booking?schema=public
    ports:
      - '3000:3000'
    depends_on:
      - postgres
    networks:
      - private-net
      - reseau-web
networks:
  private-net:
    driver: bridge
  reseau-web:
    external: true
  volumes:
    postgres:
